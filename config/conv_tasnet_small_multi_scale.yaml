# Conv-TasNet Multi-Scale source separator configuration: 16kHz, 2 sources

# run-specific parameters
run:
  seed: 42
  device: null  # null for auto, otherwise cpu, mps (Apple Silicon) or cuda (GPU)

# model hyperparameters (Multi-Scale)
model:
  encoder_channels: 128                # N: number of encoder/decoder channels
  bottleneck_channels: 128             # B: number of bottleneck channels
  hidden_channels: 256                 # H: number of hidden channels in TCN blocks
  encoder_kernel_sizes: [8, 16, 32]  # Multi-scale encoder kernel sizes
  tcn_kernel_size: 3                   # P: TCN kernel size
  num_blocks: 6                        # X: number of TCN blocks per repeat
  num_repeats: 2                       # R: number of times to repeat TCN blocks
  num_tcn_scales: 3                    # Number of hierarchical TCN branches (fine, medium, coarse)
  use_frequency_aware: true            # Use frequency-aware convolutions

# training hyperparameters
training:
  epochs: 100
  learning_rate: 1e-3
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  use_amp: true               # use automatic mixed precision (CUDA only)
  scheduler: reduce_on_plateau  # options: none, step, cosine, reduce_on_plateau
  scheduler_params:
    step:
      step_size: 10
      gamma: 0.5
    cosine: null
    reduce_on_plateau:
      factor: 0.5
      patience: 5
  save_every: 5               # save checkpoint every N epochs
  early_stopping_patience: 10 # stop training if no improvement after N epochs

# Multi-Scale Model size presets (for reference)
#
# Small model (~3-5M params):
#   encoder_channels: 128
#   bottleneck_channels: 128
#   hidden_channels: 256
#   encoder_kernel_sizes: [8, 16, 32]  # 3 scales
#   num_blocks: 6
#   num_repeats: 2
#   num_tcn_scales: 2
#   use_frequency_aware: true
#
# Medium model (~7-10M params) - CURRENT CONFIG:
#   encoder_channels: 256
#   bottleneck_channels: 256
#   hidden_channels: 512
#   encoder_kernel_sizes: [8, 16, 32, 64]  # 4 scales
#   num_blocks: 8
#   num_repeats: 3
#   num_tcn_scales: 3
#   use_frequency_aware: true
#
# Large model (~25-35M params):
#   encoder_channels: 512
#   bottleneck_channels: 512
#   hidden_channels: 1024
#   encoder_kernel_sizes: [4, 8, 16, 32, 64]  # 5 scales
#   num_blocks: 8
#   num_repeats: 4
#   num_tcn_scales: 4
#   use_frequency_aware: true
#
# Notes:
# - Multi-scale models have ~30-50% more parameters than standard Conv-TasNet
# - encoder_kernel_sizes: list of kernel sizes for multi-scale encoding
#   * Smaller kernels (4, 8): capture fine-grained details
#   * Larger kernels (32, 64): capture coarse temporal patterns
# - num_tcn_scales: number of hierarchical TCN branches
#   * Each branch has different dilation progression
#   * More branches = better multi-scale modeling but more memory
# - use_frequency_aware: adaptive kernel selection based on frequency content
#   * Improves separation quality but adds ~5-10% parameters
