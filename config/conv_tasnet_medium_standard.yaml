# Conv-TasNet source separator configuration: 16kHz, 2 sources

# run-specific parameters
run:
  seed: 42
  device: null  # null for auto, otherwise cpu, mps (Apple Silicon) or cuda (GPU)

# model hyperparameters
model:
  encoder_channels: 256       # N: number of encoder/decoder channels
  bottleneck_channels: 256    # B: number of bottleneck channels
  hidden_channels: 512        # H: number of hidden channels in TCN blocks
  kernel_size: 16             # L: encoder kernel size
  tcn_kernel_size: 3          # P: TCN kernel size
  num_blocks: 8               # X: number of TCN blocks per repeat
  num_repeats: 3              # R: number of times to repeat TCN blocks
  stride: 8                   # encoder stride (typically L/2)

# training hyperparameters
training:
  epochs: 100
  learning_rate: 1e-3
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  use_amp: true               # use automatic mixed precision (CUDA only)
  scheduler: reduce_on_plateau  # options: none, step, cosine, reduce_on_plateau
  scheduler_params:
    step:
      step_size: 10
      gamma: 0.5
    cosine: null
    reduce_on_plateau:
      factor: 0.5
      patience: 5
  save_every: 5               # save checkpoint every N epochs
  early_stopping_patience: 10 # stop training if no improvement after N epochs

# Model size presets (for reference)
#
# Small model (~2M params):
#   encoder_channels: 128
#   bottleneck_channels: 128
#   hidden_channels: 256
#   num_blocks: 6
#   num_repeats: 2
#
# Medium model (~5M params) - CURRENT CONFIG:
#   encoder_channels: 256
#   bottleneck_channels: 256
#   hidden_channels: 512
#   num_blocks: 8
#   num_repeats: 3
#
# Large model (~20M params):
#   encoder_channels: 512
#   bottleneck_channels: 512
#   hidden_channels: 1024
#   num_blocks: 8
#   num_repeats: 4
